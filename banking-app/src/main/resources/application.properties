# Spring Application Configuration
spring.application.name=banking-application
server.port=8080

# MongoDB Configuration
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.auto-index-creation=true

# SpringDoc OpenAPI & Swagger UI Configuration
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.api-docs.path=/v3/api-docs

# Bank Interest Rate Configurations (Annual Rates)
# 4.0% annual interest on Savings accounts
bank.interest.savings-annual-rate=0.04
# 8.5% default annual interest on Loans
bank.interest.loan-annual-rate=0.085

# Logging level
logging.level.com.bank.app=INFO
logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG
